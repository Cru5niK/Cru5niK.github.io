<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamBD — Free Live TV</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e1a;--bg2:#111827;--bg3:#1a2235;--card:#151d2e;
  --border:rgba(255,255,255,0.08);--text:#f0f4ff;--muted:#8892a4;
  --accent:#3b82f6;--accent2:#60a5fa;--green:#22c55e;--red:#ef4444;--gold:#f59e0b;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 1.2rem;display:flex;align-items:center;gap:.8rem;height:58px;position:sticky;top:0;z-index:100}
.logo{font-size:1.3rem;font-weight:700;color:#60a5fa;flex:1}
.logo span{color:var(--text)}
.live-badge{background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:2px 5px;border-radius:3px;letter-spacing:1px}
.search-bar{display:flex;align-items:center;background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:0 10px;gap:7px;height:34px;flex:1;max-width:260px}
.search-bar input{background:none;border:none;outline:none;color:var(--text);font-size:13px;width:100%}
.search-bar input::placeholder{color:var(--muted)}
.fifa-btn{background:#16a34a;border:none;color:#fff;font-size:12px;font-weight:600;padding:0 13px;height:34px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap}
.fifa-btn:hover{background:#15803d}
.pulse{width:7px;height:7px;background:#4ade80;border-radius:50%;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}
.stats-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:.5rem 1.2rem;display:flex;align-items:center;gap:1.2rem;font-size:12px;color:var(--muted);overflow-x:auto;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:4px;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.layout{display:flex;min-height:calc(100vh - 105px)}
aside{width:210px;min-width:210px;background:var(--bg2);border-right:1px solid var(--border);padding:.8rem 0;overflow-y:auto;max-height:calc(100vh - 105px);position:sticky;top:105px}
.cat-label{font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--muted);padding:0 .9rem .4rem;text-transform:uppercase}
.cat-item{display:flex;align-items:center;justify-content:space-between;padding:.45rem .9rem;cursor:pointer;font-size:13px;color:var(--muted);border-left:3px solid transparent;transition:all .15s}
.cat-item:hover{background:var(--bg3);color:var(--text)}
.cat-item.active{background:rgba(59,130,246,.12);color:#60a5fa;border-left-color:#3b82f6}
.cat-count{background:var(--bg3);font-size:10px;padding:1px 6px;border-radius:20px;min-width:24px;text-align:center}
main{flex:1;padding:1.2rem;overflow:auto}
.section-title{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:.8rem;margin-top:1.2rem;padding-bottom:.4rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.channel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.8rem;margin-bottom:.8rem}
.channel-card{background:var(--card);border:1px solid var(--border);border-radius:9px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s}
.channel-card:hover{transform:translateY(-2px);border-color:#3b82f6}
.channel-thumb{height:90px;background:var(--bg3);display:flex;align-items:center;justify-content:center;position:relative;flex-direction:column;gap:4px}
.ch-logo{font-size:1.8rem}
.ch-name-thumb{font-size:9px;color:var(--muted);max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.channel-card:hover .overlay{opacity:1}
.play-icon{width:38px;height:38px;border-radius:50%;background:#3b82f6;display:flex;align-items:center;justify-content:center}
.play-icon::after{content:'';border-left:13px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px}
.ch-live{position:absolute;top:6px;left:6px;background:var(--red);color:#fff;font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px}
.ch-hd{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.7);color:#60a5fa;font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px}
.channel-info{padding:.5rem .65rem}
.ch-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-meta{font-size:10px;color:var(--muted);margin-top:2px}
/* MODAL */
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;align-items:center;justify-content:center}
#modal.open{display:flex}
.modal-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;width:92vw;max-width:900px;overflow:hidden}
.modal-header{padding:.9rem 1.1rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.modal-title{font-size:15px;font-weight:600}
.close-btn{background:var(--bg3);border:1px solid var(--border);color:var(--muted);width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.player-wrap{position:relative;background:#000;aspect-ratio:16/9}
#player-video{width:100%;height:100%;display:block}
.player-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;color:var(--muted);font-size:13px;text-align:center;padding:1rem}
.player-msg.hidden{display:none}
.modal-footer{padding:.7rem 1.1rem;display:flex;gap:.6rem;align-items:center;font-size:12px;color:var(--muted);border-top:1px solid var(--border);flex-wrap:wrap}
.alt-link{background:var(--bg3);border:1px solid var(--border);color:#60a5fa;padding:3px 10px;border-radius:5px;cursor:pointer;font-size:11px;text-decoration:none}
.alt-link:hover{background:rgba(59,130,246,.15)}
.try-btn{background:#3b82f6;border:none;color:#fff;padding:4px 12px;border-radius:5px;cursor:pointer;font-size:11px;font-weight:600}
.try-btn:hover{background:#2563eb}
/* FIFA */
.fifa-section{background:rgba(22,163,74,.1);border:1px solid rgba(34,197,94,.2);border-radius:11px;padding:1.1rem;margin-bottom:1.2rem}
.fifa-header{display:flex;align-items:center;gap:9px;margin-bottom:.9rem}
.fifa-header h2{font-size:17px;font-weight:700}
.wc-badge{background:rgba(245,158,11,.15);color:var(--gold);font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;border:1px solid rgba(245,158,11,.3)}
.match-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.7rem}
.match-card{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:.75rem;cursor:pointer;transition:border-color .15s}
.match-card:hover{border-color:var(--green)}
.match-time{font-size:10px;color:var(--green);font-weight:600;margin-bottom:5px}
.match-teams{font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.vs{font-size:10px;color:var(--muted)}
.match-label{font-size:10px;color:var(--muted);margin-top:4px}
/* LOADING */
.loading-msg{text-align:center;padding:3rem;color:var(--muted);font-size:13px}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto .8rem}
@keyframes spin{to{transform:rotate(360deg)}}
.progress-bar{height:3px;background:var(--bg3);border-radius:2px;margin:.5rem auto;max-width:200px}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s;width:0%}
.error-box{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:.8rem 1rem;font-size:12px;color:#fca5a5;margin:.5rem 0}
@media(max-width:600px){aside{display:none}.logo{font-size:1rem}}
</style>
</head>
<body>
<header>
  <div class="logo">Stream<span>BD</span> <span class="live-badge">LIVE</span></div>
  <div class="search-bar">
    <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="#8892a4" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="Search channels..." oninput="filterChannels()">
  </div>
  <button class="fifa-btn" onclick="showFIFA()"><div class="pulse"></div>⚽ FIFA 2026</button>
</header>

<div class="stats-bar">
  <div class="stat"><div class="dot"></div>Live Channels: <strong id="totalLive">Loading…</strong></div>
  <div class="stat">🇧🇩 BD: <strong id="bdCount">—</strong></div>
  <div class="stat">🇮🇳 India: <strong id="inCount">—</strong></div>
  <div class="stat">🌏 SE Asia: <strong id="seaCount">—</strong></div>
  <div class="stat">⚽ Sports: <strong id="sportCount">—</strong></div>
  <div class="stat">📰 News: <strong id="newsCount">—</strong></div>
  <div class="stat">🎬 Movies: <strong id="movCount">—</strong></div>
  <div class="stat" id="loadStatus" style="color:#60a5fa">⏳ Fetching playlist…</div>
</div>

<div class="layout">
  <aside><div class="cat-label">Categories</div><div id="categoryList"></div></aside>
  <main id="mainContent">
    <div class="loading-msg">
      <div class="spinner"></div>
      <div>Loading channels...</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div id="progressText" style="font-size:11px;margin-top:.3rem;color:var(--muted)">Connecting…</div>
    </div>
  </main>
</div>

<!-- MODAL -->
<div id="modal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Channel</div>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>
    <div class="player-wrap">
      <video id="player-video" controls autoplay playsinline></video>
      <div class="player-msg" id="playerMsg">
        <div class="spinner"></div>
        <div id="playerMsgText">Loading stream…</div>
      </div>
    </div>
    <div class="modal-footer">
      <span>🔗 Backup streams:</span>
      <div id="altLinks" style="display:flex;gap:5px;flex-wrap:wrap"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<script>
// ── CONFIG ────────────────────────────────────────────────
const CHANNELS_JSON = "./channels.json";

// Priority categories to show first, with BD/India at top
const PRIORITY = ["Bangladesh","India","Pakistan","SE Asia","Sports","News","Movies","Music","Kids","Documentary","Religion","Other"];

// Country → category mapping (we'll auto-assign from country codes)
const COUNTRY_CAT = {
  BD:"Bangladesh", IN:"India", PK:"Pakistan",
  SG:"SE Asia", MY:"SE Asia", TH:"SE Asia", PH:"SE Asia", ID:"SE Asia",
  VN:"SE Asia", MM:"SE Asia", KH:"SE Asia", LA:"SE Asia", BN:"SE Asia",
  JP:"SE Asia", KR:"SE Asia", CN:"SE Asia", HK:"SE Asia", TW:"SE Asia",
  LK:"India", NP:"India",
};

// Group-category keywords
const CAT_KEYWORDS = {
  Sports:/sport|cricket|football|soccer|hockey|tennis|golf|racing|motor|nba|nfl|nhl|mlb|espn|star sport|willow|ten sport|eurosport|bein|dazn|supersport|fighting|wrestling|extreme/i,
  News:/news|cnn|bbc|al jazeera|sky news|ndtv|times now|republic|france 24|dw |trt|euronews|nhk|arirang|voa|abc news|nbc news|cbs news|fox news|cnbc|bloomberg/i,
  Movies:/movie|cinema|film|cinemax|hbo|hallmark|lifetime|horror|thriller|action|comedy channel/i,
  Music:/music|mtv|vh1|hits|radio|concert|jazz|rock|pop|beat/i,
  Kids:/kid|child|cartoon|nickelodeon|disney|boomerang|baby|junior|toon|anime/i,
  Documentary:/documentary|discovery|national geographic|natgeo|history|science|animal|planet|explore/i,
  Religion:/islamic|quran|peace tv|god|church|hindu|buddhist|spiritual|prayer|tv9 bangla/i,
};

const FIFA_MATCHES = [
  {teams:["USA","Bolivia"],time:"Live Now 🔴",label:"Group A · Match 1"},
  {teams:["Canada","Morocco"],time:"Live Now 🔴",label:"Group B · Match 1"},
  {teams:["Brazil","Mexico"],time:"Today 20:00",label:"Group D · Match 2"},
  {teams:["Argentina","Chile"],time:"Today 23:00",label:"Group E · Match 2"},
  {teams:["England","Tunisia"],time:"Tomorrow 18:00",label:"Group C"},
  {teams:["Germany","Japan"],time:"Tomorrow 21:00",label:"Group F"},
];

// ── STATE ─────────────────────────────────────────────────
let allChannels = [];
let categories = {};
let activeCategory = "All";
let hlsInstance = null;
let currentStreams = [];
let currentStreamIdx = 0;

// ── PARSE M3U ─────────────────────────────────────────────
function parseM3U(text) {
  const lines = text.split('\n');
  const channels = [];
  let current = null;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (line.startsWith('#EXTINF')) {
      current = { name:'', group:'', country:'', logo:'', languages:[], url:'' };
      // name is after last comma
      const nameMatch = line.match(/,(.+)$/);
      if (nameMatch) current.name = nameMatch[1].trim();
      // attributes
      const groupMatch = line.match(/group-title="([^"]*)"/i);
      if (groupMatch) current.group = groupMatch[1];
      const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
      if (logoMatch) current.logo = logoMatch[1];
      const countryMatch = line.match(/tvg-country="([^"]*)"/i);
      if (countryMatch) current.country = countryMatch[1].toUpperCase();
      const langMatch = line.match(/tvg-language="([^"]*)"/i);
      if (langMatch) current.languages = langMatch[1].split(';').map(l=>l.trim());
    } else if (line && !line.startsWith('#') && current) {
      current.url = line;
      current.cat = assignCategory(current);
      channels.push(current);
      current = null;
    }
  }
  return channels;
}

function assignCategory(ch) {
  // Country-first for BD, India, Pakistan, SE Asia
  const cc = ch.country.split(';')[0].trim();
  if (COUNTRY_CAT[cc]) return COUNTRY_CAT[cc];
  // Then by group/name keywords
  const hay = (ch.group + ' ' + ch.name).toLowerCase();
  for (const [cat, regex] of Object.entries(CAT_KEYWORDS)) {
    if (regex.test(hay)) return cat;
  }
  // Group title as fallback
  if (ch.group && ch.group !== 'Undefined') return ch.group;
  return 'Other';
}

// ── FETCH PLAYLIST ────────────────────────────────────────
async function fetchPlaylist() {
  try {

    setProgress(20, "Loading channels...");

    const response = await fetch(CHANNELS_JSON);

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    setProgress(60, "Reading channels...");

    allChannels = await response.json();

    // Ensure category exists
    allChannels.forEach(ch => {
      if (!ch.cat) {
        ch.cat = assignCategory(ch);
      }
    });

    setProgress(80, "Building interface...");

    buildUI();

    setProgress(100, "Ready");

    document.getElementById("loadStatus").textContent =
      `✅ ${allChannels.length.toLocaleString()} channels loaded`;

  } catch (err) {

    console.error(err);

    document.getElementById("loadStatus").textContent =
      "❌ Failed to load channels";

    showFetchError();
  }
}
  // Fallback: use a smaller reliable mirror
  try {
    setProgress(40, "Trying mirror…");
    const res = await;
    const text = await res.text();
    allChannels = parseM3U(text);
    buildUI();
    document.getElementById("loadStatus").textContent = "✅ " + allChannels.length + " BD channels loaded (mirror)";
  } catch(e) {
    showFetchError();
  }
}

function setProgress(pct, msg) {
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = msg;
}

function showFetchError() {
  document.getElementById("mainContent").innerHTML = `
    <div class="loading-msg">
      <div style="font-size:2rem;margin-bottom:.5rem">⚠️</div>
      <div style="color:var(--text);margin-bottom:.5rem">Could not load playlist</div>
      <div class="error-box">Browser blocked the request (CORS). Try opening the site in a different browser, or disable tracking protection temporarily.</div>
      <button onclick="fetchPlaylist()" class="try-btn" style="margin-top:.8rem;padding:8px 20px;font-size:13px">🔄 Retry</button>
    </div>`;
  document.getElementById("loadStatus").textContent = "❌ Load failed";
}

// ── BUILD UI ──────────────────────────────────────────────
function buildUI() {
  categories = {};
  allChannels.forEach(ch => {
    if (!categories[ch.cat]) categories[ch.cat] = [];
    categories[ch.cat].push(ch);
  });

  // Sidebar
  const list = document.getElementById("categoryList");
  list.innerHTML = `<div class="cat-item active" onclick="setCategory('All')"><span>📺 All</span><span class="cat-count">${allChannels.length}</span></div>`;

  // Priority categories first
  const shown = new Set();
  PRIORITY.forEach(cat => {
    if (categories[cat]) {
      const em = catEmoji(cat);
      list.innerHTML += `<div class="cat-item" onclick="setCategory('${cat}')"><span>${em} ${cat}</span><span class="cat-count">${categories[cat].length}</span></div>`;
      shown.add(cat);
    }
  });
  // Remaining
  Object.keys(categories).sort().forEach(cat => {
    if (!shown.has(cat)) {
      list.innerHTML += `<div class="cat-item" onclick="setCategory('${cat}')"><span>📺 ${cat}</span><span class="cat-count">${categories[cat].length}</span></div>`;
    }
  });

  // Stats
  document.getElementById("totalLive").textContent = allChannels.length.toLocaleString();
  document.getElementById("bdCount").textContent = (categories["Bangladesh"]||[]).length;
  document.getElementById("inCount").textContent = (categories["India"]||[]).length;
  document.getElementById("seaCount").textContent = ["SE Asia","Japan","Korea"].reduce((a,c)=>a+(categories[c]||[]).length,0);
  document.getElementById("sportCount").textContent = (categories["Sports"]||[]).length;
  document.getElementById("newsCount").textContent = (categories["News"]||[]).length;
  document.getElementById("movCount").textContent = (categories["Movies"]||[]).length;

  renderMain(allChannels);
}

function catEmoji(cat) {
  const m={Bangladesh:"🇧🇩",India:"🇮🇳",Pakistan:"🇵🇰","SE Asia":"🌏",Sports:"⚽",News:"📰",Movies:"🎬",Music:"🎵",Kids:"🧒",Documentary:"🎥",Religion:"🕌",Other:"📺"};
  return m[cat]||"📺";
}

// ── RENDER ────────────────────────────────────────────────
function setCategory(cat) {
  activeCategory = cat;
  document.querySelectorAll(".cat-item").forEach(el => {
    const t = el.querySelector("span")?.textContent||"";
    el.classList.toggle("active", cat==="All" ? t.includes("All") : t.includes(cat));
  });
  const chs = cat==="All" ? allChannels : (categories[cat]||[]);
  renderMain(chs);
}

function filterChannels() {
  const q = document.getElementById("searchInput").value.toLowerCase();
  const base = activeCategory==="All" ? allChannels : (categories[activeCategory]||[]);
  renderMain(q ? base.filter(c=>c.name.toLowerCase().includes(q)||c.group.toLowerCase().includes(q)) : base);
}

function renderMain(channels) {
  const main = document.getElementById("mainContent");
  let html = "";

  // FIFA section on top
  if (activeCategory==="All"||activeCategory==="Sports") {
    html += buildFIFA();
  }

  if (!channels.length) {
    main.innerHTML = html + `<div class="loading-msg">No channels found.</div>`;
    return;
  }

  if (activeCategory==="All") {
    // Show priority categories in sections, limit 20 each for performance
    const shown = new Set();
    PRIORITY.forEach(cat => {
      if (!categories[cat]||!categories[cat].length) return;
      html += buildSection(cat, categories[cat].slice(0,20), categories[cat].length);
      shown.add(cat);
    });
  } else {
    html += buildSection(activeCategory, channels, channels.length);
  }

  main.innerHTML = html;
}

function buildSection(cat, chs, total) {
  const showMore = total > chs.length;
  let h = `<div class="section-title"><span>${catEmoji(cat)} ${cat}</span><span>${total} channels${showMore?' (showing '+chs.length+')':''}</span></div><div class="channel-grid">`;
  chs.forEach(ch => {
    const idx = allChannels.indexOf(ch);
    const logo = ch.logo ? `<img src="${ch.logo}" style="width:48px;height:30px;object-fit:contain;border-radius:3px" onerror="this.style.display='none'">` : `<span class="ch-logo">${catEmoji(ch.cat)}</span>`;
    h += `<div class="channel-card" onclick="openChannel(${idx})">
      <div class="channel-thumb">
        ${logo}
        <span class="ch-name-thumb">${ch.name}</span>
        <div class="overlay"><div class="play-icon"></div></div>
        <span class="ch-live">● LIVE</span>
      </div>
      <div class="channel-info">
        <div class="ch-name">${ch.name}</div>
        <div class="ch-meta">${ch.country||'🌐'} · ${ch.cat}</div>
      </div>
    </div>`;
  });
  h += `</div>`;
  if (showMore) {
    h += `<div style="text-align:center;margin-bottom:1rem"><button class="try-btn" onclick="setCategory('${cat}')" style="padding:6px 18px;font-size:12px">See all ${total} ${cat} channels →</button></div>`;
  }
  return h;
}

function buildFIFA() {
  return `<div class="fifa-section">
    <div class="fifa-header"><span style="font-size:1.8rem">🏆</span><h2>FIFA World Cup 2026™</h2><span class="wc-badge">USA · Canada · Mexico</span></div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:.8rem">Click a match → search for live streams below ↓</div>
    <div class="match-cards">${FIFA_MATCHES.map((m,i)=>`
      <div class="match-card" onclick="searchFIFA('${m.teams[0]} vs ${m.teams[1]}')">
        <div class="match-time">${m.time}</div>
        <div class="match-teams"><span>${m.teams[0]}</span><span class="vs">VS</span><span>${m.teams[1]}</span></div>
        <div class="match-label">${m.label}</div>
      </div>`).join('')}
    </div>
  </div>`;
}

// ── PLAYER ────────────────────────────────────────────────
function openChannel(idx) {
  const ch = allChannels[idx];
  currentStreams = [ch.url];
  currentStreamIdx = 0;
  document.getElementById("modalTitle").textContent = (ch.country||'🌐') + ' ' + ch.name;
  showPlayerMsg("Loading stream…", true);
  // Build alt links
  const al = document.getElementById("altLinks");
  al.innerHTML = `<a class="alt-link" href="${ch.url}" target="_blank">Direct Stream ↗</a>
    <a class="alt-link" href="https://www.youtube.com/results?search_query=${encodeURIComponent(ch.name+' live stream')}" target="_blank">Search YouTube ↗</a>`;
  document.getElementById("modal").classList.add("open");
  playStream(ch.url);
}

function playStream(url) {
  const video = document.getElementById("player-video");
  if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
  video.src = "";

  if (!url) { showPlayerMsg("No stream URL available.", false); return; }

  const isHLS = url.includes(".m3u8") || url.includes(".m3u");

  if (isHLS && Hls.isSupported()) {
    hlsInstance = new Hls({ enableWorker:true, lowLatencyMode:true });
    hlsInstance.loadSource(url);
    hlsInstance.attachMedia(video);
    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
      hidePlayerMsg();
      video.play().catch(()=>{});
    });
    hlsInstance.on(Hls.Events.ERROR, (e, data) => {
      if (data.fatal) showPlayerMsg("Stream failed. Try a backup link below.", false);
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl') && isHLS) {
    video.src = url;
    video.addEventListener('loadedmetadata', () => { hidePlayerMsg(); video.play(); });
    video.addEventListener('error', () => showPlayerMsg("Stream failed. Try a backup link below.", false));
  } else {
    // Try direct for non-HLS
    video.src = url;
    video.addEventListener('loadedmetadata', () => { hidePlayerMsg(); video.play(); });
    video.addEventListener('error', () => showPlayerMsg("Stream failed. Try a backup link below.", false));
  }
}

function showPlayerMsg(msg, loading) {
  document.getElementById("playerMsg").classList.remove("hidden");
  document.getElementById("playerMsgText").textContent = msg;
  document.querySelector("#playerMsg .spinner").style.display = loading ? "block" : "none";
}
function hidePlayerMsg() {
  document.getElementById("playerMsg").classList.add("hidden");
}

function closeModal() {
  document.getElementById("modal").classList.remove("open");
  const video = document.getElementById("player-video");
  if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
  video.pause(); video.src = "";
}

function searchFIFA(query) {
  document.getElementById("searchInput").value = query.split(" vs ")[0];
  filterChannels();
  // Also open YouTube search
  window.open("https://www.youtube.com/results?search_query=" + encodeURIComponent(query + " FIFA World Cup 2026 live"), "_blank");
}

function showFIFA() { setCategory("All"); window.scrollTo(0,0); }

document.getElementById("modal").addEventListener("click", e => {
  if (e.target === document.getElementById("modal")) closeModal();
});

// ── INIT ──────────────────────────────────────────────────
fetchPlaylist();
</script>
